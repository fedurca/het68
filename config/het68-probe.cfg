# het68 — OpenOCD interface config for Raspberry Pi Debug Probe (CMSIS-DAP).
#
# Used by upload.sh.  Probe serial is injected at runtime when known.
# Override speed: HET68_OPENOCD_ADAPTER_KHZ=1000 ./upload.sh

adapter driver cmsis-dap

if { [info exists ::env(HET68_OPENOCD_ADAPTER_KHZ)] && $::env(HET68_OPENOCD_ADAPTER_KHZ) != "" } {
    adapter speed $::env(HET68_OPENOCD_ADAPTER_KHZ)
} else {
    adapter speed 4000
}

if { [info exists ::env(HET68_PROBE_SERIAL)] && $::env(HET68_PROBE_SERIAL) != "" } {
    adapter serial $::env(HET68_PROBE_SERIAL)
}
