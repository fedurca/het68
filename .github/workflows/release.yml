# Build firmware on a GitHub Release whose tag is semver core (semver.org):
#   x.y.z   or   vx.y.z
# Uploads UF2 + ELF as release assets:
#   pico2 | pico2_w (CYW43439 Wi-Fi/BT) | Pico Plus 2 W
# After a successful build, force-moves the floating git tag `latest` to that
# commit and marks the GitHub Release as the repo "Latest" release.
name: Release firmware

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-firmware-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semver tag (x.y.z or vx.y.z)
        id: semver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${TAG}' is not x.y.z or vx.y.z (semver.org core)."
            echo "Create the release with a tag like 1.2.3 or v1.2.3."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Validated semver tag: ${TAG} (version ${VERSION})"

      - name: Install ARM toolchain and build deps
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            cmake \
            git \
            python3 \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1

      - name: Fetch Pico SDK (pinned 2.2.0)
        run: ./scripts/fetch_pico_sdk.sh

      - name: Build pico2 firmware
        env:
          PICO_BOARD: pico2
          CC: gcc
          CXX: g++
        run: ./build.sh

      - name: Stage pico2 artifacts
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -f build/pico_6mic_soundcard.uf2
          test -f build/pico_6mic_soundcard.elf
          mkdir -p dist
          cp -v build/pico_6mic_soundcard.uf2 "dist/het68-${VERSION}-pico2.uf2"
          cp -v build/pico_6mic_soundcard.elf "dist/het68-${VERSION}-pico2.elf"

      - name: Build Pico 2 W firmware (CYW43439 Wi-Fi/BT, BLE Remote ID)
        env:
          PICO_BOARD: pico2_w
          CC: gcc
          CXX: g++
        run: |
          set -Eeuo pipefail
          rm -rf build
          ./build.sh

      - name: Stage Pico 2 W artifacts
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -f build/pico_6mic_soundcard.uf2
          test -f build/pico_6mic_soundcard.elf
          cp -v build/pico_6mic_soundcard.uf2 "dist/het68-${VERSION}-pico2-w.uf2"
          cp -v build/pico_6mic_soundcard.elf "dist/het68-${VERSION}-pico2-w.elf"

      - name: Build Pico Plus 2 W firmware (BLE Remote ID)
        env:
          PICO_BOARD: pimoroni_pico_plus2_w_rp2350
          CC: gcc
          CXX: g++
        run: |
          set -Eeuo pipefail
          rm -rf build
          ./build.sh

      - name: Stage Plus 2 W artifacts
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -f build/pico_6mic_soundcard.uf2
          test -f build/pico_6mic_soundcard.elf
          cp -v build/pico_6mic_soundcard.uf2 "dist/het68-${VERSION}-pico-plus2-w.uf2"
          cp -v build/pico_6mic_soundcard.elf "dist/het68-${VERSION}-pico-plus2-w.elf"
          ls -la dist/

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          make_latest: true
          files: |
            dist/het68-${{ steps.semver.outputs.version }}-pico2.uf2
            dist/het68-${{ steps.semver.outputs.version }}-pico2.elf
            dist/het68-${{ steps.semver.outputs.version }}-pico2-w.uf2
            dist/het68-${{ steps.semver.outputs.version }}-pico2-w.elf
            dist/het68-${{ steps.semver.outputs.version }}-pico-plus2-w.uf2
            dist/het68-${{ steps.semver.outputs.version }}-pico-plus2-w.elf
          fail_on_unmatched_files: true

      # Floating pointer for "whatever last built successfully as a semver release".
      # Not a semver tag — do not create a GitHub Release named "latest".
      - name: Move floating git tag latest
        env:
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Release checkout is the tagged commit; pin latest there after green build.
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force
          echo "Moved git tag latest -> ${GITHUB_SHA} (release ${TAG})"
